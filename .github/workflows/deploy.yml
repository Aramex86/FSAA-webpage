name: Deploy docs to Pages

# Триггеры: merge в main = деплой; ручной запуск для тестов
on:
  push:
    branches: [main]
  workflow_dispatch: {} # кнопка "Run workflow" в Actions — для первого прогона

permissions:
  contents: write # право коммитить (нужен peaceiris)

concurrency:
  group: gh-pages-deploy # два merge подряд → не конфликтуют, второй ждёт
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # тот же Node, что у тебя локально
          cache: npm # кэш node_modules → сборка ~40 с вместо ~2 мин

      - run: npm ci
      - run: npm run build # output: 'export' → ./out (next.config.mjs делает всю магию basePath)

      - uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: Aramex86/fsaa # прод-репо (ветка gh-pages)
          publish_branch: gh-pages
          publish_dir: ./out
          personal_token: ${{ secrets.DEPLOY_PAT }}
          enable_nojekyll: true # создаст .nojekyll — как у нас сейчас руками
          commit_message: "docs: auto-deploy from ${{ github.repository }}@${{ github.sha }}"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
